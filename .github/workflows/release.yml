# Publishes every package whose version is not on npm yet, when a v* tag is
# pushed. Uses npm trusted publishing (OIDC): no npm token is stored in GitHub,
# and each release gets a provenance statement. See RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Publish new versions
        run: |
          failed=""
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "$version" ]; then
              echo "${name}@${version} is already published"
            elif ! (cd "$dir" && npm publish --access public --provenance); then
              failed="${failed} ${name}@${version}"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Not published:${failed}"
            exit 1
          fi
